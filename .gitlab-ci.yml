variables:
  USER: legit
  VIBRA_HOME: $CI_BUILDS_DIR/$CI_PROJECT_PATH
  GIT_SUBMODULE_STRATEGY: recursive
  CONDA_MODULE_LOAD: python/miniforge3-25.3.0
  CONDA_ENV: "pipeline_${CI_PIPELINE_ID}"
  CONDA_ENV_BASE: ci_vibrations

workflow:
    rules: # these are the rules for any pipelines to start
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "web"'
        - if: '$CI_PIPELINE_SOURCE == "schedule"'

default:
    id_tokens: # mandatory to authenticate with runner, see issue #75 in pyadf
        SITE_ID_TOKEN:
            aud: https://gitlab.pyadf.org
    tags:
      - local
      - shell
    before_script:
        - hostname
        - . /usr/share/modules/init/bash
        - . /usr/share/modules/init/setup
        - module load $CONDA_MODULE_LOAD
        - conda activate $CONDA_ENV
        - cd $CI_PROJECT_DIR
        - export TMPDIR=/scratch/$USER/ci-pipeline_${CI_PIPELINE_ID}/${CI_JOB_ID}
        - mkdir -p $TMPDIR
        - cd $TMPDIR
        - echo "Running in directory $TMPDIR "

stages:
    - build
    - unittest
    - quality
    - autodoc
    - deploy
    - cleanup

install_vibrations:
  tags:
    - local
    - shell
  rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "web"'
        - if: '$CI_PIPELINE_SOURCE == "schedule"' # schedules can be created via the web interface
  before_script:
        - hostname
        - . /usr/share/modules/init/bash
        - . /usr/share/modules/init/setup
        - module load $CONDA_MODULE_LOAD
        - |-
            if conda env list | grep -q $CONDA_ENV; then
                conda env remove --name $CONDA_ENV --yes
            fi
        #packages from environment.yml files, special file needed as long as pyADF fails to declare its dependencies correctly
        - conda env create -n $CONDA_ENV -f $CI_PROJECT_DIR/requirements/environment_tests_doc_pyadf.yml -y
        - conda activate $CONDA_ENV #needed as long as pyADF fails to declare this as a dependency
        - pip install docstr-coverage sphinx-mdinclude # not available on conda-forge
        #pyadf installation
        - git clone https://github.com/chjacob-tubs/pyadf-releases.git 
        - cd pyadf-releases 
        - pip install .
        - cd $CI_PROJECT_DIR

  stage: build
  script:
    - pip install --no-deps -e .
 #   - pip install --no-deps -e ".[fints]"
 # artifacts:
 #   paths:
 #     - src/Vibrations/fints.so
 #   expire_in: 1 day

       

