variables:
  SCHEDULER_PARAMETERS: "-n 1 -p nitrogen"
  USER: legit
  VIBRA_HOME: $CI_BUILDS_DIR/$CI_PROJECT_PATH
  GIT_SUBMODULE_STRATEGY: recursive
  #GIT_SUBMODULE_FORCE_HTTPS: "true"
  #GIT_SUBMODULE_PATHS: src/_VibTools


stages:
    - build
    - test


before_script:
        - hostname
        - module load module_include_dir
        - . /usr/share/modules/init/bash
        - . /usr/share/modules/init/setup 
        - export PYTHONPATH=$PYTHONPATH:$VIBRA_HOME/src
        - export PYTHONPATH=$PYTHONPATH:$VIBRA_HOME/src/_VibTools/src/
        - git submodule update --recursive
        - module load python/anaconda3-2021.11
        - source activate base
        - conda init bash
        - module load pyadf/master-20220201
        - module list 
        - pip list
        
        
build-environment:
    tags:
        - nodes
    stage: build
    script:
        - cd requirements/
        - conda env create -f environment_human_readable.yml --force # create conda env from human readable requirements
        - cd ../
        - conda activate NewVib #VT_CI: maschine readable VibTools conda CI-environment
        - conda env list # Show some environment details for debugging
        - conda list
        - conda list -n NewVib python
        - conda list -n NewVib matplotlib
        - conda list -n NewVib numpy
        - conda list -n NewVib scipy
        - conda list -n NewVib openbabel
        - conda list -n NewVib pytest
#        - conda list -n NewVib sphinx
#        - conda list -n NewVib sphinx_rtd_theme




unittest-Grids-Pawel:
    tags:
        - nodes
    stage: test
    script:
        - conda activate NewVib
        - cd unittests/
        - pytest -v test_Grids_unittest.py
        - cd ../

