################
# CODE QUALITY ####################################################################
################

unittest-Coverage:
    stage: quality
    tags:
        - local
        - shell
    script:
        - pytest --cov=Vibrations --cov-report term --cov-report xml:$CI_PROJECT_DIR/coverage.xml $CI_PROJECT_DIR/src/Vibrations/unittests/
    coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
    artifacts:
      reports:
        coverage_report:
          coverage_format: cobertura
          path: $CI_PROJECT_DIR/coverage.xml

unittest-Report:
    stage: quality
    tags:
        - local
        - shell
    script:
        - pytest --junitxml=$CI_PROJECT_DIR/report.xml $CI_PROJECT_DIR/src/Vibrations/unittests/
    artifacts:
      when: always
      reports:
        junit: $CI_PROJECT_DIR/report.xml

unittest-Min-Coverage:
    stage: quality
    script:
        - pytest --cov=Vibrations --cov-fail-under=56 $CI_PROJECT_DIR/src/Vibrations/unittests/


docstr-Min-Coverage:
    stage: quality
    tags:
        - local
        - shell
    script:
        - docstr-coverage --fail-under=88 -b $CI_PROJECT_DIR $CI_PROJECT_DIR/src/Vibrations/*.py
    artifacts:
      paths:
        - $CI_PROJECT_DIR/docstr_coverage_badge.svg

Style-Check-Min:
    stage: quality
    script:
        - pylint --fail-under=8.1 $CI_PROJECT_DIR/src/Vibrations


#######################
#### INTEGRATIONTEST ###########################################################
#######################

integrationtest-Vibrations:
    stage: unittest
    script:
        - python $CI_PROJECT_DIR/src/Vibrations/tests/tests.py

#######################
#### DOCUMENTATION #############################################################
#######################

build-sphinx-doc:
    stage: autodoc
    script:
        - sphinx-build $CI_PROJECT_DIR/doc/ $TMPDIR/build


pages:
    stage: deploy
    tags:
      - local
      - shell
    script:
        - sphinx-build $CI_PROJECT_DIR/doc/ $TMPDIR/build
        - mkdir $CI_PROJECT_DIR/public
        - cp -r $TMPDIR/build/* $CI_PROJECT_DIR/public/
    artifacts:
        paths:
         - $CI_PROJECT_DIR/public


##################
#### CLEAN UP ##################################################################
##################

cleanup_conda:
    tags:
      - local
      - shell
    before_script:
        - hostname
        - . /usr/share/modules/init/bash
        - . /usr/share/modules/init/setup
        - module load $CONDA_MODULE_LOAD
    stage: cleanup
    when: always
    script:
        - conda env remove --name $CONDA_ENV --yes
